paths:
  raw_data: data/raw/Reviews.csv
  processed_corpus: data/processed/reviews.jsonl
  eda_summary: artifacts/reports/eda_summary.json
  bm25_index: artifacts/indexes/bm25.pkl
  faiss_index: artifacts/indexes/reviews.faiss
  embeddings: artifacts/indexes/review_embeddings.npy
  benchmark: data/processed/benchmark.jsonl
seed: 42
retrieval:
  top_k: 5
  bm25: {k1: 1.5, b: 0.75}
  dense: {model: BAAI/bge-small-en-v1.5, batch_size: 64}
  hybrid: {alpha: 0.5, candidate_k: 30}
  reranker: {model: cross-encoder/ms-marco-MiniLM-L-6-v2, batch_size: 16}
generation:
  provider: ollama
  model: llama3.2:3b
  temperature: 0.0
evaluation:
  ks: [1, 3, 5, 10]
  split_seed: 42
  test_fraction: 0.25
